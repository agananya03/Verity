services:
  - type: web
    name: verity-backend
    runtime: python
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "python -m uvicorn backend.api.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false
      - key: EMBEDDING_BACKEND
        value: fastembed
      - key: PYTHONPATH
        value: .

